name: EoSim Sanity

on:
  # A change to this file, or to the commands it exercises, tests itself.
  pull_request:
    paths:
      - '.github/workflows/eosim-sanity.yml'
      - 'ebuild/cli/golden_path.py'
      - 'ebuild/templates/**'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  # A pinned EoSim release tag. This was a pinned commit through
  # 2026-10-14: every tag through v3.0.1 had the filter bug in which
  # "eosim list" printed "Available platforms (0)" and still exited 0
  # (EoSim#34), and c5e2770 (the merge of EoSim#35, which fixes that)
  # was the pin. v3.0.2 is the first tag containing the fix —
  # verified 2026-10-15 via the compare API: tag 21a39ca is 3 commits
  # ahead of c5e2770 — so the pin moves to the tag, per #128 and the
  # org install-eosim action's default.
  EOSIM_REF: "v3.0.2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-validate:
    name: Install & Validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install EoSim and this ebuild
        run: |
          python -m pip install "embeddedos-eosim @ git+https://github.com/embeddedos-org/EoSim@${{ env.EOSIM_REF }}" .
      - name: The registry is not empty
        # Exit status alone proved nothing here: "eosim list" exited 0 while
        # listing zero platforms. Count what it returns.
        shell: python
        run: |
          import json, subprocess
          rows = json.loads(subprocess.check_output(["eosim", "list", "--format", "json"], text=True))
          names = subprocess.check_output(["ebuild", "platforms", "list", "--format", "names"], text=True).split()
          print(f"eosim list: {len(rows)} platforms; ebuild platforms list: {len(names)}")
          assert len(rows) >= 100, f"eosim list returned only {len(rows)} platforms"
          assert sorted(names) == sorted(r["name"] for r in rows), "ebuild and eosim disagree"
      - name: eosim doctor
        run: eosim doctor

  # The getting-started guide's simulator path, run as written: setup, init,
  # then sim. ebuild sim builds the rtos template with the EoS kernel for
  # QEMU's Cortex-M3 machine and passes only if the expected output shows up.
  golden-path:
    name: Getting-started path (ebuild init + ebuild sim on QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
      - name: Install ebuild and EoSim
        run: python -m pip install "embeddedos-eosim @ git+https://github.com/embeddedos-org/EoSim@${{ env.EOSIM_REF }}" .
      - name: ebuild setup
        run: ebuild setup
      - name: ebuild init
        working-directory: ${{ runner.temp }}
        run: ebuild init my-blink --template rtos --target stm32f4
      - name: ebuild sim boots the EoS kernel and the app runs
        working-directory: ${{ runner.temp }}/my-blink
        run: ebuild sim --expect 'id=3 value=40' --timeout 60
      - name: Unsupported boards are refused, not faked
        working-directory: ${{ runner.temp }}/my-blink
        run: |
          if ebuild sim --platform esp32; then
            echo "::error::ebuild sim --platform esp32 reported success; there is no ESP32 sim target"
            exit 1
          fi

  sanity-gate:
    name: EoSim Sanity Gate
    if: always()
    needs: [install-validate, golden-path]
    runs-on: ubuntu-latest
    steps:
      # Iterates toJSON(needs) so the gate cannot fall out of step with needs:.
      - name: Every job in this workflow must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ -z "${RESULTS:-}" ] || [ "$RESULTS" = "null" ]; then
            echo "::error::gate received no results to check"
            exit 1
          fi
          printf '%s\n' "$RESULTS"
          bad=$(printf '%s' "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "  \(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::EoSim Sanity Gate failed. These jobs did not succeed:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All EoSim sanity jobs succeeded."
