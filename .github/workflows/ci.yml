name: CI — ebuild

on:
  push:
    # master is this repository's default branch; main and develop do not
    # exist, so this workflow never ran on any push or pull request.
    branches: [master, main, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

# Every other workflow in this repo declares a concurrency group; ci.yml,
# the heaviest one, did not. Pushing twice to a PR left the earlier run
# queued, and both competed for the same scarce windows/macos runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Test Matrix ───────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # macos-latest, not macos-13: the macos-13 image is retired, so jobs
        # requesting it are never assigned a runner and sit queued until they
        # time out. Every other workflow in this repo already uses macos-latest.
        os: [ubuntu-22.04, macos-latest, windows-2022]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime dependencies come from pyproject.toml. The previous
          # `pip install -r requirements.txt` referenced a file that does
          # not exist in this repository and failed the job outright.
          pip install -e .
          pip install pytest pytest-cov pytest-benchmark mypy ruff yamllint

      - name: Lint (ruff)
        run: ruff check .

      - name: Lint YAML (yamllint)
        run: yamllint .

      # --exclude: layers/eosuite/ vendors its own tests/ package, so a bare
      # `mypy .` sees two modules named "tests" and bails with "Duplicate
      # module named 'tests'" before checking anything. continue-on-error hid
      # that the type check was doing no work at all.
      - name: Type check (mypy)
        run: mypy . --ignore-missing-imports --no-strict-optional --exclude '^(layers|core|promo)/'

      # Runs the whole tests/ tree. The previous steps ran only tests/unit/
      # and tests/functional/ — 15 of the 98 collected tests — so
      # tests/ebuild/ (81 tests, and the only suite that exercises the
      # ebuild package itself) was never executed by CI.
      #
      # --cov-fail-under=0 disables pytest-cov's local gate. .coveragerc
      # sets an aspirational fail_under = 100 that the suite has never met
      # (23.72% measured), which would fail every run. The project's
      # coverage policy already lives in codecov.yml; whether to also
      # enforce it here is a maintainer decision, so this change leaves
      # both of those numbers alone.
      # shell: bash -- the matrix includes windows-2022, where the default
      # shell is PowerShell and the backslash line continuations below are a
      # syntax error ("Missing expression after unary operator '--'"), so the
      # Windows leg of this job failed before pytest ever started.
      - name: Run test suite
        shell: bash
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=ebuild --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=0

      - name: Run performance benchmarks
        run: python -m pytest tests/performance/ -v --tb=short --benchmark-json=benchmark.json
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: ebuild-py${{ matrix.python-version }}

  # ── Build Python Package ──────────────────────────────────────────────────
  build:
    name: Build Python Package
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ebuild-wheel
          path: dist/*.whl
          retention-days: 90

  # ── Release ───────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build release package
        run: |
          pip install build
          python -m build
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
