[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI name. "ebuild" on PyPI is an unrelated project (neutree/ebuild),
# so `pip install ebuild` never installed this one. The import package and
# the `ebuild` command keep their names.
name = "embeddedos-ebuild"
version = "3.0.1"
description = "Unified embedded build system — supports Make, CMake, Meson, Cargo, Buildroot, Zephyr, FreeRTOS, NuttX"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "ninja>=1.11",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
]

[project.scripts]
ebuild = "ebuild.cli.commands:cli"

[project.entry-points."ebuild.plugins"]

[tool.setuptools.packages.find]
include = ["ebuild*"]

# Project templates and package recipes are data, not modules; without this
# they are missing from the wheel and `ebuild new` / `ebuild install` break
# for anyone who installed ebuild with pip.
[tool.setuptools.package-data]
ebuild = ["templates/*/*.template", "recipes/*.yaml"]

[tool.ruff]
exclude = [
    ".venv",
    "core",
    "layers/eosuite",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name
    "F403",  # star import used (manim requires it in promo/)
    "F405",  # name may be undefined from a star import
    "F541",  # f-string without placeholders
    "F841",  # unused local variable
]
